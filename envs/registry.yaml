  compositional_optimizer: envs/cat_theo/compositional_optimizer/config.yaml
  tokenizer_adjunction: envs/cat_theo/tokenizer_adjunction/config.yaml
  architecture_naturality: envs/cat_theo/architecture_naturality/config.yaml
  transformer_ssm_lift: envs/cat_theo/transformer_ssm_lift/config.yaml
  categorical_lenses: envs/cat_theo/categorical_lenses/config.yaml
  monadic_reward: envs/cat_theo/monadic_reward/config.yaml
