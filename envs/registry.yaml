# Environment registry
# Maps environment names to their config.yaml paths.
# This replaces the hardcoded fallback chains in generate_env.py.
# To add a new environment: add an entry here - no code changes needed.

environments:
  # Core ML debugging environments
  glyph: envs/glyph/config.yaml
  batchnorm_ema: envs/batchnorm_ema/config.yaml
  moco: envs/moco/config.yaml
  rope: envs/rope/config.yaml

  # Category-theoretic environments
  tensor_functor: envs/cat_theo/tensor_functor/config.yaml
