# epistemic_fragmented_observation: asymmetric/fragmented observation (E5).
#
# Source grounding: Mission 02 question E5 from the epistemic-compiler corpus
# - exact truth classification of registered propositions about pooled
# (distributed) observation, with the registered observation matrix varied
# under identical narrative and base rules. Built on the accepted CS005 S5
# substrate and the CS011 fragmented-observation module shipped from
# shared/epistemic_semantics. Per the CS011 boundary, pooling intersects
# observation cells; it does not implement communication and establishes
# neither individual nor common knowledge.
#
# Discrimination certificates (rejection at construction):
#   asymmetric -> pooled set is a proper subset of each individual cell;
#   symmetric  -> the named scenario's own facts do not decide the payload.

renderer: renderer.py

axes:
  - id: worlds
    description: "Model size: number of scenarios in the model"
    levels:
      four:
        "%%WORLDS_ID%%": "four"
      six:
        "%%WORLDS_ID%%": "six"

  - id: fragment
    description: "Observation matrix structure: symmetric (shared partition) or asymmetric (distinct partitions)"
    levels:
      symmetric:
        "%%FRAGMENT_ID%%": "symmetric"
      asymmetric:
        "%%FRAGMENT_ID%%": "asymmetric"

  - id: scenario
    description: "Surface scenario template (varies names and labels to reduce retrieval cues)"
    levels:
      expedition:
        "%%SCENARIO_ID%%": "expedition"
      office:
        "%%SCENARIO_ID%%": "office"

scoring:
  mode: exact_classification

constants:
  "%%PATCHABLE_FILES%%": '["answer.py"]'
  "%%EXTRA_ALLOWED_IMPORTS%%": '""'

static_files: []

layout:
  agent/workspace/task.md: task.md
  agent/workspace/answer.py: answer.py
  agent/workspace/visible_tests.py: visible_tests.py

  agent/tools/submit.py: shared/submit.py
  agent/tools/tool_state.py: shared/tool_state.py
  agent/tools/run_train.py: shared/run_train.py
  agent/tools/run_eval.py: shared/run_eval.py
  agent/tools/inspect_logs.py: shared/inspect_logs.py
  agent/Dockerfile: Dockerfile.agent
  agent/agent_entrypoint.sh: shared/agent_entrypoint.sh

  judge/judge.py: judge.py
  judge/core.py: core.py
  judge/instance_spec.py: instance_spec.py
  judge/patch_validator.py: shared/patch_validator.py
  judge/source_validator.py: shared/source_validator.py
  # Shared exact-semantics package (accepted CS005/CS011 substrate; judge-side
  # only - nothing here reaches the agent workspace).
  judge/epistemic_semantics/__init__.py: shared/epistemic_semantics/__init__.py
  judge/epistemic_semantics/epistemic_relations.py: shared/epistemic_semantics/epistemic_relations.py
  judge/epistemic_semantics/public_announcements.py: shared/epistemic_semantics/public_announcements.py
  judge/epistemic_semantics/fragmented_observation.py: shared/epistemic_semantics/fragmented_observation.py
  judge/Dockerfile: Dockerfile.judge

  run_eval.sh: shared/run_eval.sh

# Latent factors (decision item 4, PR-C): what this environment's task identity
# is declared to be.  Scaffold-generated by tools/latent_factors_scaffold.py from
# axis classes, axis ids and placeholder patterns; `declared_by:
# scaffold_unreviewed` means no one has certified these as causal claims - move
# the stamp to `human` when the mapping below has been reviewed.
latent_factors:
  schema_version: 1
  declared_by: scaffold_unreviewed
  factors:
    task_state:
      # WORLDS_ID <- default:task_state
      # FRAGMENT_ID <- default:task_state
      # SCENARIO_ID <- default:task_state
      source: instance_spec
      identity_keys: []   # whole baked spec; author a projection on review
      placeholders: [WORLDS_ID, FRAGMENT_ID, SCENARIO_ID]
    causal_mechanism:
      unavailable: fixed hand-authored template code; a scaffold cannot derive a generative mechanism,
        and recording one it did not derive would be a causal claim nobody made (item 4 honesty
        constraint)
    observable_state:
      unavailable: scaffold rules mapped no placeholder to observable_state
    proxy_signal:
      unavailable: scaffold rules mapped no placeholder to proxy_signal
    evaluator_state:
      scoring: true
      constants: true
      judge_files: true
    agent_belief:
      unavailable: not a property of the instance at generation time; item 8 approximates it at
        run time and says not_measurable where it cannot
