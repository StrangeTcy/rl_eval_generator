# epistemic_games: epistemic-reasoning evaluation environments.
#
# Minimal prototype: two hidden player types (level-1 genuine, level-3
# strategic), three reasoning levels (0, 1, 3), one public observation, and
# paired worlds with identical transcripts in the non-identifiable regime.
# The instance is generated symbolically by files/renderer.py (via the
# generate_env.py renderer hook) from files/core.py, which is also shipped to
# the judge, which re-derives the ground truth from the seed (provenance
# check) and grades the agent's ANSWER with a structured failure-mode
# taxonomy. See envs/epistemic_games/core.py for the full design doc.

renderer: renderer.py

# Declared evidence-selection policy (decision item 5): a deterministic module
# under the renderer-hook contract, shipped to the judge (see the layout entry
# judge/information_policy.py) and re-run there against the rebuilt instance
# spec. The family's type-3 deception claim ("the transcript was strategically
# chosen") is admissible only because this module makes the selection process
# re-derivable; the prompt's policy prose alone would be unfalsifiable.
information_policy: information_policy.py

# Deterministic, public-only self-test used before any provider sweep.
# It makes no model/API calls and does not assert provider availability.
oracle:
  reference_behavior: public_bayes_oracle
  seed: 0

axes:
  - id: scenario
    class: "presentation"
    description: "Surface scenario template (varies names and labels to reduce retrieval cues)"
    levels:
      trap:
        "%%TEMPLATE_ID%%": "trap"
      report:
        "%%TEMPLATE_ID%%": "report"

  - id: evidence
    class: "observation"
    description: "Information content of the observed announcement: no information, weak information, or strong information (likelihood-ratio band)"
    levels:
      ambiguous:
        "%%EVIDENCE_ID%%": "ambiguous"
      weak:
        "%%EVIDENCE_ID%%": "weak"
      strong:
        "%%EVIDENCE_ID%%": "strong"

  - id: presentation
    class: "task"
    description: "Task framing: type inference (solo) or paired-world observational equivalence (strategic ambiguity)"
    levels:
      solo:
        "%%PRESENTATION_ID%%": "solo"
      paired:
        "%%PRESENTATION_ID%%": "paired"

  - id: prior
    class: "task"
    description: "Prior over the two worlds: balanced (0.5/0.5) or skewed (0.6/0.4 toward the level-1 world)"
    levels:
      balanced:
        "%%PRIOR_ID%%": "balanced"
      skewed:
        "%%PRIOR_ID%%": "skewed"

  - id: framing
    class: "presentation"
    description: "Presentation framing: narrative story vs bare probability tables (control for narrative seduction)"
    levels:
      narrative:
        "%%FRAMING_ID%%": "narrative"
      bare_table:
        "%%FRAMING_ID%%": "bare_table"

# Causal interventions.
#
# These pin knobs that are also difficulty axes, which is the point: an intervention
# fixes the *epistemic structure* while the difficulty vector stays where the
# experiment wants it.  `prior` and `evidence` are task-changing - the correct
# posterior moves - so they enter pair_id and a twin that does not shift the baked
# instance spec is reported as mislabeled rather than as a null result.
interventions:
  prior:
    substitutions:
      "%%PRIOR_ID%%": "skewed"
  evidence:
    substitutions:
      "%%EVIDENCE_ID%%": "strong"
  presentation:
    substitutions:
      "%%PRESENTATION_ID%%": "paired"

# Latent factors (decision item 4, PR-C).
#
# This is the one hand-authored projection in the registry, and the reason is the
# decision's own test case: pair_id must merge twins that differ only in prose.
# The baked judge/instance_spec.py carries the ground truth *and* its presentation
# dress (template, framing, vocabulary text, transcript), so hashing the file whole
# would keep narrative and bare_table framings apart - the exact split item 13
# removes.  identity_keys below project the Bayesian core the answer is graded
# against: priors, likelihoods, the exact posterior, the verdict fields, the drawn
# observation, and per-hypothesis level/behavior.  Excluded: template, framing,
# subfamily, vocabulary and transcript text, observation_text, and the float
# posterior (the exact Fraction string is the identity; the float is a rendering).
# A prior/evidence/presentation overlay moves the projected keys through the
# renderer, so a task-changing declaration is proved from structure, not taken on
# faith - which is what tools/twin_check.py demands once the basis is latent_spec.
latent_factors:
  schema_version: 1
  declared_by: human
  factors:
    task_state:
      source: instance_spec
      placeholders: [PRESENTATION_ID, PRIOR_ID]
      identity_keys:
        - family
        - evidence
        - prior_id
        - presentation
        - seed
        - prior_world1
        - prior_world2
        - likelihoods
        - likelihood_ratio
        - posterior_world1_exact
        - verdict
        - most_supported
        - observational_equivalence
        - actual_world
        - observation
        - hypotheses.level
        - hypotheses.behavior
    causal_mechanism:
      # Item 5: the evidence-selection mechanism is now a declared,
      # re-derivable module (information_policy: above), shipped to the judge
      # and re-run there against the rebuilt instance spec. POLICY_ID names
      # the selection process; v1 is constant across instances (one public
      # announcement, reader-dependent world-2 speaker, declared signal
      # table), so identity relations are unchanged - but the mechanism is no
      # longer "unavailable": the judge can reproduce the delivery record.
      # Per-instance draw provenance remains in the baked instance spec and
      # evaluator_state.judge_files.
      placeholders: [POLICY_ID]
    observable_state:
      placeholders: [TEMPLATE_ID, FRAMING_ID, EVIDENCE_ID]
    proxy_signal:
      unavailable: >-
        the visible tests are a static template; no placeholder varies what the
        proxy shows, so there is no per-instance proxy declaration to make
    evaluator_state:
      scoring: true
      constants: true
      judge_files: true
    agent_belief:
      unavailable: >-
        not a property of the instance at generation time; item 8 approximates it
        at run time and says not_measurable where it cannot

scoring:
  mode: continuous_accuracy
  pass_threshold: 0.85
  partial_threshold: 0.60

constants:
  "%%PATCHABLE_FILES%%": '["answer.py"]'
  "%%EXTRA_ALLOWED_IMPORTS%%": '""'

static_files: []

layout:
  agent/workspace/task.md: task.md
  agent/workspace/answer.py: answer.py
  agent/workspace/visible_tests.py: visible_tests.py

  agent/tools/submit.py: shared/submit.py
  agent/tools/tool_state.py: shared/tool_state.py
  agent/tools/run_train.py: shared/run_train.py
  agent/tools/run_eval.py: shared/run_eval.py
  agent/tools/inspect_logs.py: shared/inspect_logs.py
  agent/Dockerfile: Dockerfile.agent
  agent/agent_entrypoint.sh: shared/agent_entrypoint.sh

  judge/judge.py: judge.py
  judge/core.py: core.py
  judge/information_policy.py: information_policy.py
  judge/instance_spec.py: instance_spec.py
  judge/patch_validator.py: shared/patch_validator.py
  judge/source_validator.py: shared/source_validator.py
  judge/Dockerfile: Dockerfile.judge

  run_eval.sh: shared/run_eval.sh
