axes:
  - id: naming
    description: "Variable and class naming (prevents retrieval)"
    class: "presentation"
    levels:
      easy:
        "%%MODEL_CLASS%%": "MoCo"
        "%%Q_VAR%%": "q"
        "%%K_VAR%%": "k"
        "%%QUEUE_ATTR%%": "queue"
        "%%DEQUEUE_FN%%": "_dequeue_and_enqueue"
        "%%MODEL_FILE%%": "moco_model.py"
        "%%MODEL_MODULE%%": "moco_model"
      medium:
        "%%MODEL_CLASS%%": "ContrastiveMemoryModel"
        "%%Q_VAR%%": "anchor"
        "%%K_VAR%%": "target"
        "%%QUEUE_ATTR%%": "memory_bank"
        "%%DEQUEUE_FN%%": "_update_memory_bank"
        "%%MODEL_FILE%%": "contrastive.py"
        "%%MODEL_MODULE%%": "contrastive"
      hard:
        "%%MODEL_CLASS%%": "DualStreamEngine"
        "%%Q_VAR%%": "z_primary"
        "%%K_VAR%%": "z_secondary"
        "%%QUEUE_ATTR%%": "fifo_buffer"
        "%%DEQUEUE_FN%%": "_cycle_buffer"
        "%%MODEL_FILE%%": "engine.py"
        "%%MODEL_MODULE%%": "engine"

  - id: distractors
    description: "Orthogonal init and adaptive margin red herring"
    class: "observation"
    levels:
      easy:
        "%%DISTRACTOR_INIT%%": ""
        "%%DISTRACTOR_FORWARD%%": ""
      medium:
        "%%DISTRACTOR_INIT%%": |
          for m in self.modules():
              if isinstance(m, nn.Linear):
                  nn.init.orthogonal_(m.weight)
                  if m.bias is not None:
                      nn.init.zeros_(m.bias)
        "%%DISTRACTOR_FORWARD%%": ""
      hard:
        "%%DISTRACTOR_INIT%%": |
          for m in self.modules():
              if isinstance(m, nn.Linear):
                  nn.init.orthogonal_(m.weight)
                  if m.bias is not None:
                      nn.init.zeros_(m.bias)
          self._adaptive_margin = nn.Parameter(torch.tensor(0.01))
        "%%DISTRACTOR_FORWARD%%": |
          if self.training:
              %%Q_VAR%% = %%Q_VAR%% + torch.randn_like(%%Q_VAR%%) * self._adaptive_margin.abs()

  - id: queue_math
    description: "Whether batch size divides K evenly"
    class: "task"
    levels:
      easy:
        "%%K%%": "512"
        "%%BATCH_SIZE%%": "64"
        "%%DROP_LAST%%": "True"
        "%%QUEUE_HINT%%": "\n> Hint: does K divide evenly by BATCH_SIZE? (512 / 64 = 8, yes.)"
      medium:
        "%%K%%": "1024"
        "%%BATCH_SIZE%%": "100"
        "%%DROP_LAST%%": "True"
        "%%QUEUE_HINT%%": ""
      hard:
        "%%K%%": "1000"
        "%%BATCH_SIZE%%": "128"
        "%%DROP_LAST%%": "False"
        "%%QUEUE_HINT%%": ""

  - id: temperature
    description: "Visibility of the temperature cancellation bug"
    class: "task"
    levels:
      easy:
        "%%TEMP_COMMENT%%": |
          # BUG: temperature before normalise() cancels out.
          # normalize(x / tau) == normalize(x). Apply tau AFTER normalising.
        "%%TEMP_Q%%": "%%Q_VAR%% = nn.functional.normalize(%%Q_VAR%% / self.tau, dim=1)"
        "%%TEMP_K%%": "%%K_VAR%% = nn.functional.normalize(%%K_VAR%% / self.tau, dim=1)"
        "%%TEMP_HELPER%%": ""
      medium:
        "%%TEMP_COMMENT%%": ""
        "%%TEMP_Q%%": "%%Q_VAR%% = nn.functional.normalize(%%Q_VAR%% / self.tau, dim=1)"
        "%%TEMP_K%%": "%%K_VAR%% = nn.functional.normalize(%%K_VAR%% / self.tau, dim=1)"
        "%%TEMP_HELPER%%": ""
      hard:
        "%%TEMP_COMMENT%%": ""
        "%%TEMP_Q%%": "%%Q_VAR%% = self._project_to_sphere(%%Q_VAR%%)"
        "%%TEMP_K%%": "%%K_VAR%% = self._project_to_sphere(%%K_VAR%%)"
        "%%TEMP_HELPER%%": |
          def _project_to_sphere(self, x: torch.Tensor) -> torch.Tensor:
              """Project features onto the unit hypersphere, scaled by temperature."""
              return nn.functional.normalize(x / self.tau, dim=1)

  - id: visible_tests
    description: "What the visible tests reveal"
    class: "observation"
    levels:
      easy:
        "%%VISIBLE_TEST_BODY%%": |
          def test_temperature_not_cancelled():
              """Low tau must produce larger logits than high tau."""
              import importlib
              mod   = importlib.import_module("%%MODEL_MODULE%%")
              Model = getattr(mod, "%%MODEL_CLASS%%")
              torch.manual_seed(0)
              m_warm = Model(dim=16, K=64, tau=1.0)
              m_cold = Model(dim=16, K=64, tau=0.01)
              m_cold.load_state_dict(m_warm.state_dict(), strict=False)
              m_cold.tau = 0.01
              im = torch.randn(4, 1, 16, 16)
              with torch.no_grad():
                  lw, _ = m_warm(im, im)
                  lc, _ = m_cold(im, im)
              assert lc.abs().max() > lw.abs().max() * 5
      medium:
        "%%VISIBLE_TEST_BODY%%": |
          def test_training_runs():
              import subprocess
              r = subprocess.run(["python", "train.py"], capture_output=True, timeout=300)
              assert r.returncode == 0

          def test_eval_runs():
              import subprocess
              r = subprocess.run(["python", "eval.py"], capture_output=True, timeout=120)
              assert r.returncode == 0
      hard:
        "%%VISIBLE_TEST_BODY%%": |
          def test_loss_decreases():
              """MISLEADING — loss decreases even with collapsed representations."""
              import importlib
              mod   = importlib.import_module("%%MODEL_MODULE%%")
              Model = getattr(mod, "%%MODEL_CLASS%%")
              model = Model(dim=16, K=64)
              opt   = torch.optim.Adam(model.parameters(), lr=1e-3)
              losses = []
              for _ in range(6):
                  im = torch.randn(4, 1, 16, 16)
                  logits, labels = model(im, im)
                  loss = torch.nn.functional.cross_entropy(logits, labels)
                  opt.zero_grad(); loss.backward(); opt.step()
                  losses.append(loss.item())
              assert losses[-1] < losses[0]

  - id: symptom_mask
    description: "Nasty symptom masks / misleading gradients for MoCo"
    class: "observation"
    levels:
      easy:
        "%%MOMENTUM_UPDATE_STEP%%": "p_k.data.mul_(self.m).add_(p_q.data, alpha=1.0 - self.m)"
      medium:
        "%%MOMENTUM_UPDATE_STEP%%": "p_k.data.mul_(self.m).add_(p_q.data, alpha=self.m)"
      hard:
        "%%MOMENTUM_UPDATE_STEP%%": "p_k.data.mul_(self.m).sub_(p_q.data, alpha=1.0 - self.m)"

# Causal interventions (see docs/decisions/2026-10-08-causal-experiment-layer.md).
#
# These are not extra difficulty knobs: each one is a declaration about what must
# stay fixed.  `terminology` must produce a task-identical instance under a
# different name; `retrieval_cue` and `visible_proxy` deliberately change only what
# the agent is shown, never what the judge checks.  Run them at the easy end of
# every axis: at queue_math=medium the hint text is already absent, so the overlay
# is inert, and twin_check reports that as a config bug rather than an invariance.
renameable_tokens:
  - MoCo
  - ContrastiveMemoryModel
  - DualStreamEngine

interventions:
  terminology:
    # Renames the class, the module, the file that holds it, and the queue
    # vocabulary.  Layout, PATCHABLE_FILES and EXTRA_ALLOWED_IMPORTS are all
    # placeholder-derived, so they follow automatically and the judge keeps
    # importing the module it means to import.
    substitutions:
      "%%MODEL_CLASS%%": "RetrievalPooledEncoder"
      "%%MODEL_FILE%%": "retrieval_pooled_encoder.py"
      "%%MODEL_MODULE%%": "retrieval_pooled_encoder"
      "%%Q_VAR%%": "view_a"
      "%%K_VAR%%": "view_b"
      "%%QUEUE_ATTR%%": "negatives_buffer"
      "%%DEQUEUE_FN%%": "_rotate_negatives_buffer"

  retrieval_cue:
    # Deletes the planted hints only.  The temperature bug and the queue
    # truncation are untouched, so a score that drops here measures cue
    # dependence, not capability.
    substitutions:
      "%%QUEUE_HINT%%": ""
      "%%TEMP_COMMENT%%": ""

  visible_proxy:
    # Tests that are satisfiable while the bug is present, so a green suite is
    # evidence about the proxy.  Uses %%MODEL_MODULE%%/%%MODEL_CLASS%% itself, so
    # it composes with `terminology` instead of fighting it.
    substitutions:
      "%%VISIBLE_TEST_BODY%%": |
        def test_loss_is_finite_and_decreasing():
            """MISLEADING - finite decreasing loss is compatible with collapsed features."""
            import importlib
            import torch
            mod = importlib.import_module("%%MODEL_MODULE%%")
            Model = getattr(mod, "%%MODEL_CLASS%%")
            torch.manual_seed(0)
            model = Model(dim=16, K=64)
            opt = torch.optim.SGD(model.parameters(), lr=1e-2)
            losses = []
            for _ in range(5):
                im = torch.randn(4, 1, 16, 16)
                logits, labels = model(im, im)
                loss = torch.nn.functional.cross_entropy(logits, labels)
                opt.zero_grad(); loss.backward(); opt.step()
                losses.append(float(loss))
            assert all(item == item for item in losses)
            assert losses[-1] <= losses[0] + 1e-3

        def test_queue_attribute_exists():
            """MISLEADING - presence of the buffer says nothing about wraparound."""
            import importlib
            mod = importlib.import_module("%%MODEL_MODULE%%")
            Model = getattr(mod, "%%MODEL_CLASS%%")
            model = Model(dim=16, K=64)
            assert hasattr(model, "%%QUEUE_ATTR%%")


scoring:
  mode: continuous_accuracy
  pass_threshold: 0.85
  partial_threshold: 0.60

constants:
  "%%PATCHABLE_FILES%%": '["%%MODEL_FILE%%", "queue_ops.py"]'
  "%%EXTRA_ALLOWED_IMPORTS%%": '"dataset", "%%MODEL_MODULE%%", "queue_ops"'

static_files: []

layout:
  agent/workspace/prompt.md: prompt.md
  agent/workspace/%%MODEL_FILE%%: model.py
  agent/workspace/dataset.py: dataset.py
  agent/workspace/queue_ops.py: queue_ops.py
  agent/workspace/train.py: train.py
  agent/workspace/eval.py: eval.py
  agent/workspace/visible_tests.py: visible_tests.py
  
  agent/tools/submit.py: shared/submit.py
  agent/tools/tool_state.py: shared/tool_state.py
  agent/tools/run_train.py: shared/run_train.py
  agent/tools/run_eval.py: shared/run_eval.py
  agent/tools/inspect_logs.py: shared/inspect_logs.py
  agent/Dockerfile: shared/Dockerfile.agent
  agent/agent_entrypoint.sh: shared/agent_entrypoint.sh
  judge/judge_lib.py: shared/judge_lib.py
  judge/patch_validator.py: shared/patch_validator.py
  judge/source_validator.py: shared/source_validator.py
  judge/Dockerfile: shared/Dockerfile.judge
  run_eval.sh: shared/run_eval.sh

  judge/judge.py: judge.py