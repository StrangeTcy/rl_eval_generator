# Identify how evidence was produced.
# Axis meanings are defined in arena/epistemic_families/evidence_process.mjs.
schema: epistemic-family-config/1
family: evidence_process
seed: 3
privateSeed: 7
axes:
  # Accessible interventions on the gate and sensor.
  # easy = [paired_trace, gate_audit, calibrate, source_audit]
  # medium = [paired_trace, source_audit]; hard = [source_audit]
  diagnostic_access: easy
  # Number of initially displayed observations.
  # easy = 1; medium = 2; hard = 3
  evidence_batch: easy
  # Raw source alphabet size; selecting its maximum amplifies its display probability by this factor.
  # easy = 2; medium = 3; hard = 5
  severity: easy
  # Credits for diagnostic interventions; paired/source traces cost one, gate/sensor interventions cost two.
  # easy = 4; medium = 2; hard = 1
  diagnostic_budget: easy
