# Sequential inquiry under a budget.
# Axis meanings are defined in arena/epistemic_families/inquiry_control.mjs.
schema: epistemic-family-config/1
family: inquiry_control
seed: 3
privateSeed: 7
axes:
  # Number of competing latent states.
  # easy = 4; medium = 6; hard = 8
  world_count: easy
  # Cost of each query from a six-unit budget.
  # easy = 1; medium = 2; hard = 3
  cost_pressure: easy
  # Which components of a diagnostic result survive presentation.
  # easy = full; medium = pair-coarsened; hard = zero-or-erasure
  presentation: easy
  # Balanced, overlapping or nested diagnostic partitions.
  # easy = balanced; medium = overlapping; hard = nested
  query_topology: easy
