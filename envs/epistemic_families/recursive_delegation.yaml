# Recursive delegation with private signals.
# Axis meanings are defined in arena/epistemic_families/recursive_delegation.mjs.
schema: epistemic-family-config/1
family: recursive_delegation
seed: 3
privateSeed: 7
axes:
  # Maximum number of delegation edges below the first participant.
  # easy = 1; medium = 2; hard = 3
  depth: easy
  # Number of distinct downstream participants at each non-leaf.
  # easy = 1; medium = 2; hard = 3
  branching: easy
  # Magnitude of signed participant preference offsets from the principal goal.
  # easy = 0; medium = 1; hard = 2
  alignment: easy
  # Participant signal partition of six possible states.
  # easy = full; medium = shifted-pairs; hard = erased
  private_information: easy
  # Number of paid signal inspections available to the principal.
  # easy = 2; medium = 1; hard = 0
  inspection_budget: easy
