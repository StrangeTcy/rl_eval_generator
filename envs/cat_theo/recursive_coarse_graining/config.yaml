axes:
  - id: recursive_depth
    description: "For recursive and recursive_composition, the number of series-composed 2-spin regions (recorded depth). Selectable direct always builds one region and records depth 1. This is a 2-spin integer toy."
    class: "task"
    levels:
      easy:
        "%%DEPTH%%": "1"
      medium:
        "%%DEPTH%%": "2"
      hard:
        "%%DEPTH%%": "3"

  - id: scale_regime
    description: "Selectable levels: direct (one projector region, fixed), recursive (series of projectors, fixed), recursive_composition (series of all-ones, not fixed). SAT polarity is the regime. A generator `flat` branch (one all-ones region) is not a config level."
    class: "task"
    levels:
      easy:
        "%%REGIME%%": "direct"
      medium:
        "%%REGIME%%": "recursive"
      hard:
        "%%REGIME%%": "recursive_composition"

  - id: representation
    description: "Whether spin labels are the listed order or a hidden permutation of {0,1}"
    class: "presentation"
    levels:
      easy:
        "%%REPRESENTATION%%": "revealed"
      hard:
        "%%REPRESENTATION%%": "inferred"

scoring:
  mode: continuous_accuracy
  pass_threshold: 1.0
  partial_threshold: 0.60

constants:
  "%%MODEL_CLASS%%": "EffectiveTableSolver"
  "%%MODEL_FILE%%": "solver.py"
  "%%PATCHABLE_FILES%%": '["solver.py"]'
  "%%EXTRA_ALLOWED_IMPORTS%%": '""'

static_files: []

layout:
  agent/workspace/prompt.md: prompt.md
  agent/workspace/%%MODEL_FILE%%: solver.py
  agent/workspace/visible_tests.py: visible_tests.py
  agent/tools/submit.py: shared/submit.py
  agent/tools/tool_state.py: shared/tool_state.py
  agent/tools/run_train.py: shared/run_train.py
  agent/tools/run_eval.py: shared/run_eval.py
  agent/tools/inspect_logs.py: shared/inspect_logs.py
  agent/Dockerfile: shared/Dockerfile.agent
  agent/agent_entrypoint.sh: shared/agent_entrypoint.sh
  judge/judge_lib.py: shared/judge_lib.py
  judge/patch_validator.py: shared/patch_validator.py
  judge/source_validator.py: shared/source_validator.py
  judge/Dockerfile: shared/Dockerfile.judge
  run_eval.sh: shared/run_eval.sh
  judge/judge.py: judge.py
  judge/network.py: network.py

latent_factors:
  schema_version: 1
  declared_by: scaffold_unreviewed
  factors:
    task_state:
      placeholders: [DEPTH, REGIME]
    causal_mechanism:
      unavailable: fixed hand-authored template code
    observable_state:
      placeholders: [REPRESENTATION]
    proxy_signal:
      unavailable: scaffold rules mapped no placeholder to proxy_signal
    evaluator_state:
      scoring: true
      constants: true
      judge_files: true
    agent_belief:
      unavailable: not a property of the instance at generation time
