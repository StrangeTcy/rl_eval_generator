axes:
  - id: recursive_depth
    description: "Nesting depth of child tiles; a nested copy must be completed before the root exit opens"
    class: "task"
    levels:
      easy:
        "%%DEPTH%%": "1"
      medium:
        "%%DEPTH%%": "2"
      hard:
        "%%DEPTH%%": "3"

  - id: gluing_regime
    description: "Route regime: tree SAT, cyclic SAT, or a cyclic orientation obstruction with every local tile still walkable"
    class: "task"
    levels:
      easy:
        "%%GLUING_REGIME%%": "tree"
      medium:
        "%%GLUING_REGIME%%": "cyclic_sat"
      hard:
        "%%GLUING_REGIME%%": "cyclic_unsat"

  - id: label_opacity
    description: "Room names: shared readable names versus per-tile-type relabellings that preserve the route"
    class: "presentation"
    levels:
      easy:
        "%%LABEL_MODE%%": "transparent"
      hard:
        "%%LABEL_MODE%%": "opaque"

  - id: structural_ambiguity
    description: "Whether a second decoy child tile with a different flip table is offered at depth 1"
    class: "task"
    levels:
      easy:
        "%%AMBIGUITY%%": "clean"
      hard:
        "%%AMBIGUITY%%": "decoy"

scoring:
  mode: continuous_accuracy
  pass_threshold: 0.85
  partial_threshold: 0.60

constants:
  "%%MODEL_CLASS%%": "MazeRouteSolver"
  "%%MODEL_FILE%%": "solver.py"
  "%%PATCHABLE_FILES%%": '["solver.py"]'
  "%%EXTRA_ALLOWED_IMPORTS%%": '""'

static_files: []

layout:
  agent/workspace/prompt.md: prompt.md
  agent/workspace/%%MODEL_FILE%%: solver.py
  agent/workspace/visible_tests.py: visible_tests.py

  agent/tools/submit.py: shared/submit.py
  agent/tools/tool_state.py: shared/tool_state.py
  agent/tools/run_train.py: shared/run_train.py
  agent/tools/run_eval.py: shared/run_eval.py
  agent/tools/inspect_logs.py: shared/inspect_logs.py
  agent/Dockerfile: shared/Dockerfile.agent
  agent/agent_entrypoint.sh: shared/agent_entrypoint.sh
  judge/judge_lib.py: shared/judge_lib.py
  judge/patch_validator.py: shared/patch_validator.py
  judge/source_validator.py: shared/source_validator.py
  judge/Dockerfile: shared/Dockerfile.judge
  run_eval.sh: shared/run_eval.sh

  judge/judge.py: judge.py
  judge/network.py: network.py

# Latent factors (decision item 4, PR-C): what this environment's task identity
# is declared to be.  Scaffold-generated by tools/latent_factors_scaffold.py from
# axis classes, axis ids and placeholder patterns; `declared_by:
# scaffold_unreviewed` means no one has certified these as causal claims - move
# the stamp to `human` when the mapping below has been reviewed.
latent_factors:
  schema_version: 1
  declared_by: scaffold_unreviewed
  factors:
    task_state:
      # DEPTH <- axis_class:task
      # GLUING_REGIME <- axis_class:task
      # AMBIGUITY <- axis_class:task
      placeholders: [DEPTH, GLUING_REGIME, AMBIGUITY]
    causal_mechanism:
      unavailable: fixed hand-authored template code; a scaffold cannot derive a generative mechanism,
        and recording one it did not derive would be a causal claim nobody made (item 4 honesty
        constraint)
    observable_state:
      # LABEL_MODE <- axis_class:presentation
      placeholders: [LABEL_MODE]
    proxy_signal:
      unavailable: scaffold rules mapped no placeholder to proxy_signal
    evaluator_state:
      scoring: true
      constants: true
      judge_files: true
    agent_belief:
      unavailable: not a property of the instance at generation time; item 8 approximates it at
        run time and says not_measurable where it cannot
