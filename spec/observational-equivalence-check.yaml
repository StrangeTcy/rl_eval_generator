# An environment experiment specification for the observational-equivalence operator.
#
# Validated and compiled by `tools/family.py`; it is the model-side counterpart of the
# offline instrument in `tools/equivalence_check_study.py` and shares that tool's arms,
# so a spec that cannot generate cannot be blamed for a null, and a result that moves
# cannot be blamed on a different instance.
#
#   python tools/family.py --spec spec/observational-equivalence-check.yaml --out families/oec --check
#   python tools/equivalence_check_study.py --seeds 3,4,5 --out experiments/operator_study
#
# The two epistemic environments that are *not* `epistemic_games` are here for the
# transfer measurement, and they are included with their graded target intact: neither
# has a value for "underdetermined" in its answer format, which is a property of the
# environment and not of the operator. That asymmetry is the finding this spec is
# designed to make unavoidable rather than average away.

spec_version: 1
id: observational-equivalence-check

question: >-
  Does making a model run an observational-equivalence check before it infers a hidden
  agent type or belief - enumerate the states compatible with the observations, ask
  whether the evidence separates them, preserve the uncertainty when it does not -
  improve its answers about hidden states, and does the improvement survive the move to
  a different epistemic environment?

hypotheses:
  - id: H1
    kind: primary
    statement: >-
      The operator helps through two separable components. Enumeration of the compatible
      states is the semantics the task demands, so it raises exact accuracy wherever an
      item is identifiable. The identifiability gate is what removes an answer that
      asserts a unique explanation for observationally identical states; it should
      therefore move the false-unique-explanation rate and not the identifiable-accuracy
      rate. A single id covering both would score the combination and attribute it to
      neither, which is why they are declared as two overlays.
  - id: H0
    kind: competing
    statement: >-
      Nothing about the instruction changes what the model can do: any measured gain is
      competence substitution, the gain of being handed the correct procedure rather than
      of being told to preserve uncertainty. Under H0 a model that already enumerates
      gains nothing, the gate shows up only as an increase in withheld answers, and the
      arm difference collapses to the difference between the reference procedure and the
      model's own prior.
  - id: Hnull
    kind: "null"  # quoted: YAML reads a bare null as None, which the validator used to default to "primary"
    statement: >-
      The operator changes nothing measurable in any stratum of any environment, in
      either direction. It is stated because the arms are byte-verified twins on matched
      instances: a null here is not "the model ignored the instruction", it is "the
      instruction cannot be followed to a different graded outcome", which would be a
      result about the response format.

measurements:
  - id: accuracy_identifiable
    description: >-
      Exact correctness against the existing oracle on items whose answer is determined by
      the public information. Reported per environment; never pooled across strata.
  - id: accuracy_non_identifiable
    description: >-
      The same against items where two hidden states produce the same observations. On
      epistemic_games the graded answer for these is the uncertainty itself, so accuracy
      here measures whether the answer says so.
  - id: false_unique_explanation_rate
    description: >-
      Share of non-identifiable items where the answer asserts that the observations
      distinguish states they do not. This is measurement 2 of the research question,
      taken from the graded fields (verdict_reported against verdict_true), not from the
      justification text.
  - id: support_undercommit_rate
    description: >-
      Share of items where the answer withholds a support claim the prior and evidence do
      carry. The mirror error of the one above, and the reason a false-positive rate is
      not reportable on its own: a blanked answer scores well on it.
  - id: format_cost_rate
    description: >-
      Share of submissions an environment cannot grade at all, in the arm whose procedure
      ends in "preserve the uncertainty". In the two modal environments the format admits
      no such value, so this is the price the clause pays, measured rather than argued.
  - id: pair_id_stability
    description: >-
      Whether control and operator members carry the same pair_id. This is what licenses
      calling the two arms the same task, and it is checked on generated bytes before any
      model is contacted.

controls:
  - id: C1
    kind: baseline
    hypothesis: H1
    member: eg_nonident_baseline
    note: >-
      The unmodified instructions at the same difficulty vector and seed. Without it a
      delta would be a difference between two datasets.
  - id: C2
    kind: presentation_preserving_twin
    hypothesis: H1
    member: eg_nonident_equivalence_check
    note: >-
      twin_check must show the trees differ and the pair_id must not move. If the trees
      do not differ the overlay is inert and the null is about the config; if the pair_id
      moves, the task changed and no invariance claim is available.
  - id: C3
    kind: held_out_seed
    hypothesis: H1
    note: >-
      Seeds 3, 4 and 5 vary the instance inside every member, so a gain cannot be an
      artifact of one drawn transcript.
  - id: C4
    kind: oracle_validity
    hypothesis: H0
    member: eg_nonident_state_enumeration
    note: >-
      The competing explanation is priced by a member that gets the enumeration with no
      permission to withhold: if enumeration alone recovers identifiable accuracy while
      leaving the false-unique-explanation rate untouched, the two components have
      separated and a gain attributed to "the instruction" would be a gain attributed to
      the semantics.
  - id: C5
    kind: task_changing_twin
    hypothesis: H0
    member: eg_identifiable_prior
    note: >-
      A prior overlay moves the correct posterior and must move pair_id. It is the
      positive control for the identity machinery: if this member were reported as
      sharing a pair_id with its baseline, then the presentation-preserving twin above
      would be proving nothing.
  - id: C6
    kind: baseline
    hypothesis: Hnull
    member: nk_baseline
    note: >-
      The null is tested where the operator has nothing to bite on: the modal
      environments name the scenario under evaluation, so every item is identifiable to
      the answerer and a nonzero delta there is measurement error, not an effect.

members:
  # epistemic_games, non-identifiable stratum: ambiguous evidence, paired worlds, skewed
  # prior - the one vector where the graded answer is the uncertainty and the prior still
  # leans, so both the target error and its mirror are reachable.
  - id: eg_nonident_baseline
    environment: epistemic_games
    difficulty: trap,ambiguous,paired,skewed,narrative
    seeds: [3, 4, 5]
    measurements: [pair_id_stability, accuracy_non_identifiable, false_unique_explanation_rate, support_undercommit_rate]
    hypotheses: [H1, H0, Hnull]

  - id: eg_nonident_equivalence_check
    environment: epistemic_games
    difficulty: trap,ambiguous,paired,skewed,narrative
    interventions: [equivalence_check]
    expect: sensitive
    seeds: [3, 4, 5]
    measurements: [accuracy_non_identifiable, false_unique_explanation_rate, support_undercommit_rate, pair_id_stability]
    hypotheses: [H1]

  - id: eg_nonident_state_enumeration
    environment: epistemic_games
    difficulty: trap,ambiguous,paired,skewed,narrative
    interventions: [state_enumeration]
    expect: sensitive
    seeds: [3, 4, 5]
    measurements: [accuracy_non_identifiable, false_unique_explanation_rate, support_undercommit_rate, pair_id_stability]
    hypotheses: [H0]

  # epistemic_games, identifiable stratum: strong evidence, single world, balanced prior.
  - id: eg_ident_baseline
    environment: epistemic_games
    difficulty: report,strong,solo,balanced,bare_table
    seeds: [3, 4, 5]
    measurements: [accuracy_identifiable, pair_id_stability]
    hypotheses: [H1, H0, Hnull]

  - id: eg_ident_equivalence_check
    environment: epistemic_games
    difficulty: report,strong,solo,balanced,bare_table
    interventions: [equivalence_check]
    expect: sensitive
    seeds: [3, 4, 5]
    measurements: [accuracy_identifiable, support_undercommit_rate, pair_id_stability]
    hypotheses: [H1]

  - id: eg_ident_state_enumeration
    environment: epistemic_games
    difficulty: report,strong,solo,balanced,bare_table
    interventions: [state_enumeration]
    expect: sensitive
    seeds: [3, 4, 5]
    measurements: [accuracy_identifiable, pair_id_stability]
    hypotheses: [H0]

  # Positive control for the identity machinery (task-changing, so its pair_id must move).
  - id: eg_identifiable_prior
    environment: epistemic_games
    difficulty: report,strong,solo,balanced,bare_table
    interventions: [prior]
    expect: sensitive
    seeds: [3, 4, 5]
    measurements: [accuracy_identifiable, pair_id_stability]
    hypotheses: [H0]

  # Transfer: nested knowledge (E4). Every item is identifiable to the answerer; the
  # answer format is a boolean, so the gate's output has no value to occupy.
  - id: nk_baseline
    environment: epistemic_nested_knowledge
    difficulty: four,first,expedition
    seeds: [3, 4, 5]
    measurements: [accuracy_identifiable, format_cost_rate, pair_id_stability]
    hypotheses: [H1, H0, Hnull]

  - id: nk_equivalence_check
    environment: epistemic_nested_knowledge
    difficulty: four,first,expedition
    interventions: [equivalence_check]
    expect: sensitive
    seeds: [3, 4, 5]
    measurements: [accuracy_identifiable, format_cost_rate, pair_id_stability]
    hypotheses: [H1, Hnull]

  - id: nk_state_enumeration
    environment: epistemic_nested_knowledge
    difficulty: four,first,expedition
    interventions: [state_enumeration]
    expect: sensitive
    seeds: [3, 4, 5]
    measurements: [accuracy_identifiable, pair_id_stability]
    hypotheses: [H0]

  # Transfer: fragmented observation (E5), where the designed error is reading the facts
  # instead of the pooled certificate.
  - id: fo_baseline
    environment: epistemic_fragmented_observation
    difficulty: four,symmetric,expedition
    seeds: [3, 4, 5]
    measurements: [accuracy_identifiable, format_cost_rate, pair_id_stability]
    hypotheses: [H1, H0, Hnull]

  - id: fo_equivalence_check
    environment: epistemic_fragmented_observation
    difficulty: four,symmetric,expedition
    interventions: [equivalence_check]
    expect: sensitive
    seeds: [3, 4, 5]
    measurements: [accuracy_identifiable, format_cost_rate, pair_id_stability]
    hypotheses: [H1, Hnull]

  - id: fo_state_enumeration
    environment: epistemic_fragmented_observation
    difficulty: four,symmetric,expedition
    interventions: [state_enumeration]
    expect: sensitive
    seeds: [3, 4, 5]
    measurements: [accuracy_identifiable, pair_id_stability]
    hypotheses: [H0]

confounds:
  - "instance randomness: every arm of a pair is generated from one seed and one difficulty vector, and pair_id equality is asserted, not assumed"
  - "instruction leakage: the overlay text is appended to the shipped task render and the render is a prefix of it, so the operator cannot delete an instruction the control had to satisfy"
  - "format availability: withholding an answer is only an option in epistemic_games; rates that depend on it are reported per environment and never pooled"
  - "evaluator drift: judge and scoring blocks are untouched by this change, and config_sha256 plus tree_sha256 are recorded per member"
  - "aggregate pooling: identifiable and non-identifiable items have opposite expected effects, so a pooled mean is reported only as the arithmetic it is"

claim_ceiling: >-
  procedural_dissociation_on_deterministic_answer_sources. The offline instrument compares
  the procedures the two overlays prescribe, on matched generated instances graded by the
  shipped oracles; it bounds what the instruction can buy a reader that follows it
  exactly, and it identifies the environments whose response format cannot express the
  behavior the operator asks for. It is not a model result: no model was sampled, and
  nothing here establishes that a model's reasoning changed. The model-side ceiling is
  behavioral_association_only across a declared transformation of the presentation, per
  stratum, with the pair_id and twin_check proofs recorded beside it.
