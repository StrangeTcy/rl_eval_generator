# Candidate Strategy IR card: the observational-equivalence check.
# SUPERSEDED by spec/strategy-ir/observational_equivalence_check.yaml, which follows the
# field list that research_protocol/strategy_ir.md later prescribed. Kept because its
# `disposition` block is the record of the decision the schema does not ask for; nothing
# should be added to this file.
#
# `research_protocol/strategy_ir.md` is not in this checkout - nor is the epistemic
# compiler it is normally emitted by - so this card follows the precedent the causal-layer
# ADR sets for absent upstreams: the contract is a file, validated here by its own fields,
# not an import. Field names are chosen to be translatable to that schema without adding
# or dropping a claim; conforming it to the real spec is a mechanical rewrite.

card_version: 1
id: observational-equivalence-check
title: Enumerate the compatible states, then check whether the evidence separates them
status: revise
family: epistemic_process_control
lineage:
  from: same_fact_presentation  # T1, already billed in the running campaigns
  to: identifiability_before_inference
  first_step: observational_equivalence_check

claim: >-
  A reasoner that enumerates the states compatible with its observations before inferring
  a hidden agent type or belief answers more items correctly, and asserts a distinction
  almost never where the observations admit none.

components:
  - id: state_enumeration
    instruction: spec/operators/state_enumeration.md
    intervention_id: state_enumeration
    mechanism: layout
    equivalence: observation_changing
    expect: sensitive
    effect_measured: >-
      identifiable accuracy 0.042 -> 1.000 on epistemic_games (n=96, exact McNemar
      p=4e-28); 0.556 -> 1.000 on epistemic_nested_knowledge (n=36, p=3e-5);
      0.833 -> 1.000 on epistemic_fragmented_observation (n=24, p=0.125, directional only).
    verdict: retain
    why: >-
      Enumeration is not an attitude, it is the semantics both the Bayesian and the
      modal-logic environments grade against, so it transfers to every one of them and
      needs no new value in any answer format.
  - id: identifiability_gate
    instruction: spec/operators/equivalence_check.md
    intervention_id: equivalence_check
    mechanism: layout
    equivalence: observation_changing
    expect: sensitive
    effect_measured: >-
      false-unique-explanation rate 1.000 -> 0.000 on non-identifiable epistemic_games
      items (n=48), bought with a 0.500 under-commit rate and 0.500 accuracy; costs
      1.000 format-invalid rate in both modal environments when obeyed literally.
    verdict: revise
    why: >-
      The clause binds to the wrong object. "Preserve the uncertainty" is read as
      "answer neither", but the graded answer on an uninformative observation with a
      skewed prior is a 0.6 posterior and a world-1 support claim: the prior is evidence.
      It is also only expressible where the response format has a value for
      underdetermination, so its cost is set by the environment rather than by the
      reasoner's epistemics.
    revision: spec/operators/equivalence_check_revised.md
    revision_effect_measured: >-
      1.000 accuracy with 0.000 separations, 0.000 over-commits and 0.000 under-commits on
      non-identifiable items, and unchanged 1.000 on identifiable ones.

scope_limits:
  - "Deterministic procedures on matched instances, not models: nothing here is evidence that a model's reasoning changed."
  - "epistemic_games only for the gate's benefit; the modal environments have no non-identifiable items for an answerer who is told the scenario."
  - "One response format per environment: a format that gains an underdetermined value changes the gate's cost, and that is a change to the environment, not to the strategy."

evidence:
  spec: spec/observational-equivalence-check.yaml
  instrument: tools/equivalence_check_study.py
  results: experiments/operator_study/REPORT.md
  raw: experiments/operator_study/raw_results.jsonl
  twin_proof: experiments/operator_study/family_verification.json
  n_instances: 228
  matched_by: one seed and one difficulty vector per instance, all arms on the same generated bytes
  identity_proof: >-
    presentation twins differ in bytes and share pair_id (27 of 27 checks pass, 0
    unverified); task-changing controls move pair_id, so the proof is not vacuous

measurement_provenance:
  accuracy: Instance.grade strict_correct (exact verdict, exact support, internal consistency, posterior within the strict tolerance)
  false_positive_inference: verdict_reported against verdict_true on items where the enumerated compatible states are observationally identical
  prior_and_evidence_handling: most_supported over-commit and under-commit rates, plus the prior axis crossed with the evidence band
  transfer: the same two overlays declared in three environments, with per-stratum rows and no pooling

next:
  - "Apply handoff/observational-equivalence-interventions.patch between campaigns: it edits env configs, so it re-plans a live one."
  - "Dispatch the spec's arms against a model to replace 'what a perfect follower scores' with 'what the model scores'."
  - "Add an arm pairing the gate with a format that has no underdetermined value, if the gate is ever proposed as a general safety clause."
