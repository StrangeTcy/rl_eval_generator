[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl_eval_generator"
version = "0.2.0"
description = "Procedurally generated ML debugging environments for evaluating AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Maxim Smirnov", email = "hatguy@yandex.ru"}
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "black>=24.0.0", 
    "mypy>=1.10.0",
    "pytest-cov>=4.1.0",
]

[tool.ruff]
# Enable flake8-compatible rules by default
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]
line-length = 100

[tool.ruff.isort]
known-first-party = ["generate_env", "env_runner", "shared"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
addopts = "-q --tb=short"
testpaths = ["tests"]
