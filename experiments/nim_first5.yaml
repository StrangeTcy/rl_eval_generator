# Bounded, cross-family NVIDIA pilot. This is an account-specific experiment
# plan, not a claim that the requested model or free allowance is available.
name: nim_first5
provider: nvidia
api_base: https://integrate.api.nvidia.com/v1
model: nvidia/nemotron-3-super-120b-a12b
api_key_env: NVIDIA_API_KEY
concurrency: 1
temperature: 1.0
top_p: 0.95
seed: 0
request_extra:
  chat_template_kwargs:
    enable_thinking: false
limits:
  max_steps: 20
  max_tokens: 8192
  invalid_retries: 1
  max_retries: 5
  max_http_attempts: 1207
  max_wall_seconds: 7200
  floor_effect_after: 0
  sandbox: docker
cases:
  - environment: regex_state_machine
    difficulty: easy,easy
  - environment: epistemic_games
    difficulty: trap,ambiguous,paired,balanced,bare_table
  - environment: categorical_lenses
    difficulty: easy,easy
  - environment: rd_state_carry
    difficulty: easy,easy,easy,easy,easy
  - environment: glyph
    difficulty: easy,easy,easy,easy,easy,easy
