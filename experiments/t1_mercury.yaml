# T1 same_fact_presentation campaign - Mercury target.
#
# Lean direct-answer campaign (no Docker, no coding-env judge). The matched-fact
# presentation probe (tools/matched_fact_probe.py) presents an IDENTICAL evidence
# set under two presentations (canonical/bullet vs reversed/numbered) and records
# the target's behavior as SEPARATE endpoints: diagnostic choices, elicited
# belief, terminal outcome (inquiry regret and recovery are not_measurable in a
# single turn). The terminal oracle is presentation-invariant BY CONSTRUCTION
# (the combined likelihood is a commutative product of per-fact likelihoods), so
# any divergence across the matched arms is *presentation susceptibility* - not
# attention manipulation, an internal update-rule change, or harm.
#
# Offline preflight first (no provider access; proves the profile is well-formed
# and within the call budget):
#   python tools/matched_fact_probe.py --profile experiments/t1_mercury.yaml --plan
# Live campaign (needs INCEPTION_API_KEY in the environment / repo secrets):
#   python tools/matched_fact_probe.py --profile experiments/t1_mercury.yaml \
#       --out runs/t1_mercury/report.json
name: t1_same_fact_presentation_mercury
operator: same_fact_presentation
reasoning_mode: controlled_reasoning_effort_high

target:
  provider: mercury
  model: mercury-2.5
  api_base: https://api.inceptionlabs.ai/v1
  api_key_env: INCEPTION_API_KEY
  wire_api: chat_completions  # Mercury's flat reasoning_effort control
  reasoning_effort: high          # Inception Mercury tunable reasoning depth
  temperature: 0.0                # deterministic where the provider allows
  max_tokens: 8192

matrix:
  # Covering matrix: cross-product of n_facts x prior_world1, swept over seeds.
  n_facts: [3, 4, 5]
  prior_world1: ["1/2", "1/3"]
  seeds: 6                        # seeds 0..5 per cell; matched symmetrically with Atria
  # seed_list: "0,1,2"            # optional explicit override of `seeds`

rate_limit:
  # Inception advertises generous limits for Mercury; stay conservative and let
  # the client's 429 backoff handle bursts. Tune against the live rate-limit doc.
  documented_requests_per_minute: 300
  min_interval_seconds: 0.2

budget:
  # Exact ceiling blocks stale or edited matrices above 72 calls before provider access.
  max_api_calls: 72
  max_tokens_total: 4000000

output:
  dir: runs/t1_mercury
