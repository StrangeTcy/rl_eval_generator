schema: epistemic-family-campaign/1
name: epistemic_reasoning_atria_campaign
provider: atria
apiBase: https://discovery-api.intern-ai.org.cn/v1
model: Atria-Dawn-Preview
apiKeyEnv: ATRIA_API_KEY
wireApi: responses
reasoningEffort: high
minIntervalMs: 1100
maxOutputTokens: 8192
timeoutMs: 120000
